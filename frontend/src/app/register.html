<div class="login-box">
  <h1>SetGame Registreren</h1>
  <p>Maak een nieuw account aan om te beginnen.</p>

  <label>
    Gebruikersnaam
    <input
      type="text"
      [(ngModel)]="username"
      placeholder="Kies een gebruikersnaam"
    />
  </label>

  <label>
    Wachtwoord
    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Kies een wachtwoord"
    />
  </label>

  <p class="error">{{ error }}</p>

  <div class="buttons">
    <button (click)="register()" [disabled]="loading">Registreer</button>
  </div>

  <p style="margin-top: 15px; text-align: center;">
    Heb je al een account? <a routerLink="/login">Log hier in</a>.
  </p>
</div>
