<div class="page">
  <div class="topbar">
    <div>
      <h1>SetGame</h1>
      @if (auth.currentUsername()) { <p>Ingelogd als {{ auth.currentUsername() }}</p> }
    </div>
    <div class="topbar-buttons">
      <button (click)="goHome()">Home</button>
      <button (click)="logout()">Uitloggen</button>
    </div>
  </div>

  <app-status-message></app-status-message>
  <app-game-meta></app-game-meta>

  @if (gameService.game(); as game) {
    <div class="board">
      @for (card of game.cards; track card.id) {
        <app-card
          [card]="card"
          [selected]="isSelected(card.id)"
          [hinted]="isHinted(card.id)"
          (cardSelected)="select($event)"
        ></app-card>
      }
    </div>
  }

  <app-game-actions (newGame)="newGame()" (abandon)="abandonGame()"></app-game-actions>
</div>
