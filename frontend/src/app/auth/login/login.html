<div class="login-box">
  <div class="avatar-container">
    <img src="plaatjes/images/babbie.png" alt="Fun Logo" class="avatar-image">
  </div>

  <h1>SetGame</h1>
  <p>Log in om verder te gaan.</p>

  <form (ngSubmit)="login(); $event.preventDefault()">
    <label>
      Gebruikersnaam
      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Voer gebruikersnaam in"
        required
      />
    </label>

    <label>
      Wachtwoord
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Voer wachtwoord in"
        required
      />
    </label>

    @if (error) {
      <div class="error">{{ error }}</div>
    }

    <div class="buttons">
      <button type="submit" [disabled]="loading">Login</button>
    </div>
  </form>
</div>
