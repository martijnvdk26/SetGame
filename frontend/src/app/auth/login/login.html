<div class="login-box">
  <h1>SetGame</h1>
  <p>Log in om verder te gaan.</p>

  <label>
    Gebruikersnaam
    <input
      type="text"
      [(ngModel)]="username"
      placeholder="Voer gebruikersnaam in"
    />
  </label>

  <label>
    Wachtwoord
    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Voer wachtwoord in"
    />
  </label>

  @if (error) {
    <div class="error">{{ error }}</div>
  }

  <div class="buttons">
    <button (click)="login()" [disabled]="loading">Login</button>
  </div>
</div>
