<div class="login-box">
  <h1>SetGame</h1>
  <p>Login of registreer om te beginnen.</p>

  <label>
    Gebruikersnaam
    <input
      type="text"
      [(ngModel)]="username"
      placeholder="Voer gebruikersnaam in"
    />
  </label>

  <label>
    Wachtwoord
    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Voer wachtwoord in"
    />
  </label>

  <p class="error">{{ error }}</p>

  <div class="buttons">
    <button (click)="login()" [disabled]="loading">Login</button>
    <button (click)="register()" [disabled]="loading" class="secondary">Register</button>
  </div>
</div>
